<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search quotes by topic — Castalia Quotes</title>
  <script src="/search-config.js"></script>
  <style>
    :root { color-scheme: light dark; --ink: #1a1a1a; --paper: #f7f4ef; --accent: #5c4d3c; --muted: #666; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ece7df; --paper: #141210; --accent: #c9b89a; --muted: #aaa; }
    }
    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: var(--paper); color: var(--ink);
      margin: 0; padding: 2rem 1.25rem; line-height: 1.5;
    }
    main { max-width: 42rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 1rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    input[type="search"] {
      flex: 1; min-width: 12rem; font: inherit; padding: 0.5rem 0.65rem;
      border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent);
      border-radius: 4px; background: var(--paper); color: var(--ink);
    }
    button {
      font: inherit; padding: 0.5rem 1rem; cursor: pointer;
      background: var(--accent); color: var(--paper); border: none; border-radius: 4px;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .status { color: var(--muted); font-size: 0.9rem; min-height: 1.25rem; }
    article { margin: 1.25rem 0; padding-bottom: 1.25rem; border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
    blockquote { margin: 0 0 0.35rem; font-size: 1.1rem; }
    .meta { font-size: 0.88rem; color: var(--muted); }
    a { color: var(--accent); }
    .score { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Search quotes by topic</h1>
    <p class="meta"><a href="/">← Castalia Quotes</a></p>
    <form id="search-form">
      <input type="search" id="q" name="q" placeholder="e.g. stoicism, libraries, nature…" required autocomplete="off" />
      <button type="submit" id="btn">Search</button>
    </form>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="results"></div>
  </main>
  <script>
    const SUPABASE_URL = window.CASTALIA_QUOTES_SUPABASE_URL;
    const ANON_KEY = window.CASTALIA_QUOTES_SUPABASE_ANON_KEY;

    const form = document.getElementById('search-form');
    const input = document.getElementById('q');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const btn = document.getElementById('btn');

    if (!SUPABASE_URL || !ANON_KEY) {
      status.textContent = 'Search is not configured (missing search-config.js).';
      btn.disabled = true;
    }

    const params = new URLSearchParams(location.search);
    if (params.get('q')) input.value = params.get('q');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;
      history.replaceState(null, '', '?q=' + encodeURIComponent(query));
      await runSearch(query);
    });

    async function runSearch(query) {
      status.textContent = 'Searching…';
      results.innerHTML = '';
      btn.disabled = true;
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/search-quotes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + ANON_KEY,
            apikey: ANON_KEY,
          },
          body: JSON.stringify({ query, limit: 10 }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        const rows = data.results || [];
        status.textContent = rows.length
          ? `Found ${rows.length} quote(s) for “${query}”.`
          : `No quotes matched “${query}”.`;
        results.innerHTML = rows.map(renderRow).join('');
      } catch (err) {
        status.textContent = 'Search failed: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function renderRow(row) {
      const pct = row.similarity != null ? Math.round(row.similarity * 100) : '';
      const readest = row.readest_url
        ? `<p class="meta"><a href="${escapeAttr(row.readest_url)}">Open in Readest</a></p>`
        : '';
      return `<article>
        <p class="meta"><span class="score">${pct}%</span> · ${escapeHtml(row.faculty_name || row.faculty_id)}</p>
        <blockquote><p>${escapeHtml(row.quote_text)}</p></blockquote>
        <p class="meta">${escapeHtml(row.passage_label || '')}</p>
        ${readest}
      </article>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/"/g,'&quot;');
    }

    if (SUPABASE_URL && ANON_KEY && input.value.trim()) runSearch(input.value.trim());
  </script>
</body>
</html>
